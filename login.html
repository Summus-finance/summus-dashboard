<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Summus – Acesso</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--br:#073222;--br-d:#031f14;--br-l:#12a06a}
body{font-family:'Segoe UI',Arial,sans-serif;background:#eef3f8;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{display:flex;width:100%;min-height:100vh}
.left{width:460px;min-width:320px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 40px;background:#fff;box-shadow:4px 0 32px rgba(0,0,0,.09)}
.right{flex:1;background:linear-gradient(145deg,var(--br-d) 0%,var(--br) 60%,var(--br-l) 100%);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:52px;position:relative;overflow:hidden}
.right::before{content:'';position:absolute;top:-80px;right:-80px;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.06);}
.right::after{content:'';position:absolute;bottom:-60px;left:-40px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.05);}
.right-text{position:relative;z-index:1}
.right-text h2{font-size:34px;font-weight:700;color:#fff;margin-bottom:12px;line-height:1.3}
.right-text p{font-size:16px;color:rgba(255,255,255,.82);line-height:1.7;max-width:380px}
.right-modules{position:relative;z-index:1;margin-top:36px;display:flex;flex-direction:column;gap:10px}
.right-mod{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:11px 16px;color:#fff;font-size:14px;font-weight:600}
.right-mod svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.9}
.box{width:100%;max-width:360px}
.logo-wrap{width:fit-content;margin:0 auto 32px}
.logo-wrap img{height:80px;width:auto;max-width:100%;display:block}
.box h2{font-size:22px;font-weight:700;color:#16263a;margin-bottom:6px}
.sub{font-size:14px;color:#6b7a8d;margin-bottom:30px;line-height:1.5}
.lf{margin-bottom:18px}
.lf label{font-size:11px;font-weight:700;color:#4a607a;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.lf input{width:100%;border:1.5px solid #cdd8e5;border-radius:9px;padding:12px 14px;font-size:15px;font-family:inherit;color:#16263a;transition:border .2s,box-shadow .2s;background:#fafbfc}
.lf input:focus{outline:none;border-color:var(--br);background:#fff;box-shadow:0 0 0 3px rgba(7,50,34,.12)}
.btn{width:100%;background:var(--br);color:#fff;border:none;border-radius:9px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px;transition:background .2s,transform .1s;letter-spacing:.3px}
.btn:hover{background:var(--br-d)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.6;cursor:wait}
.err{background:#fce8e8;color:#8b1a1a;border:1px solid #e09090;border-radius:8px;padding:11px 14px;font-size:13px;margin-top:14px;display:none;line-height:1.5}
.spin{display:none;text-align:center;padding:10px;color:var(--br);font-size:13px}
.version{position:fixed;bottom:12px;right:16px;font-size:10px;color:#aab8c6;letter-spacing:.3px}
@media(max-width:700px){
  .right{display:none}
  .left{width:100%;padding:40px 24px}
}
</style>
<script>
// Cor do sistema aplicada cedo (antes do login) para não haver flash de azul.
// Usa o cache do navegador se existir; a busca real acontece mais abaixo.
(function(){
  try{
    var c=localStorage.getItem('summus_cor_sistema');
    if(c){
      document.documentElement.style.setProperty('--br', c);
      var n=parseInt(c.replace('#',''),16);
      var r=(n>>16)&255, g=(n>>8)&255, b=n&255;
      function mix(ch,target,f){return Math.round(ch+(target-ch)*f);}
      var d='#'+[mix(r,0,.55),mix(g,0,.55),mix(b,0,.55)].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
      var l='#'+[mix(r,255,.45),mix(g,255,.45),mix(b,255,.45)].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
      document.documentElement.style.setProperty('--br-d', d);
      document.documentElement.style.setProperty('--br-l', l);
    }
  }catch(e){}
})();
</script>
</head>

      <h2>Bem-vindo</h2>
      <p class="sub">Entre com suas credenciais para acessar o painel.</p>
      <div class="lf"><label>Usuário</label><input id="inp-user" type="text" placeholder="seu usuário" autocomplete="username"></div>
      <div class="lf"><label>Senha</label><input id="inp-pass" type="password" placeholder="sua senha" autocomplete="current-password"></div>
      <button class="btn" id="login-btn">Entrar</button>
      <div class="spin" id="spin">🔄 Verificando...</div>
      <div class="err" id="err"></div>
    </div>
  </div>
  <div class="right">
  </div>
</div>
<div class="version">Summus v2.1</div>
<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytBLSuf758v_8TCG0ilhmKgDNVunANTgqtkYZaIhDaRaqZgXfZkUeG5J-aNHGg4Ny_5g/exec";
var SESSION_KEY = "summus_auth";

// Se já está logado NESTA ABA (sessionStorage), vai direto para o painel
try {
  var _s = sessionStorage.getItem(SESSION_KEY);
  if (_s && JSON.parse(_s).usuario) {
    window.location.replace('painel.html');
  }
} catch(e) {}

function _jsonp(params, cb) {
  var id = '_cb' + Date.now() + Math.floor(Math.random()*9999);
  var timer = setTimeout(function(){
    window[id]=null; var s=document.getElementById(id); if(s)s.remove();
    cb(new Error('timeout'), null);
  }, 20000);
  window[id] = function(data){
    clearTimeout(timer); window[id]=null;
    var s=document.getElementById(id); if(s)s.remove();
    cb(null, data);
  };
  var qs = Object.keys(params).map(function(k){
    var v=params[k]; if(typeof v==='object')v=JSON.stringify(v);
    return k+'='+encodeURIComponent(v);
  }).join('&');
  var s=document.createElement('script');
  s.id=id; s.src=SCRIPT_URL+'?callback='+id+'&'+qs;
  s.onerror=function(){clearTimeout(timer);window[id]=null;s.remove();cb(new Error('Falha ao conectar.'),null);};
  document.head.appendChild(s);
}

var btn=document.getElementById('login-btn');
var err=document.getElementById('err');
var spin=document.getElementById('spin');

// Mantém a cor do sistema atualizada (não exige login — getConfig é pública)
_jsonp({action:'getConfig'}, function(e,res){
  if(!e && res && res.ok && res.data && res.data.cor_sistema){
    var c=res.data.cor_sistema;
    document.documentElement.style.setProperty('--br', c);
    try{
      var n=parseInt(c.replace('#',''),16);
      var r=(n>>16)&255, g=(n>>8)&255, b=n&255;
      function mix(ch,target,f){return Math.round(ch+(target-ch)*f);}
      var d='#'+[mix(r,0,.55),mix(g,0,.55),mix(b,0,.55)].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
      var l='#'+[mix(r,255,.45),mix(g,255,.45),mix(b,255,.45)].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
      document.documentElement.style.setProperty('--br-d', d);
      document.documentElement.style.setProperty('--br-l', l);
      localStorage.setItem('summus_cor_sistema', c);
    }catch(ex){}
  }
});

function doLogin(){
  var u=document.getElementById('inp-user').value.trim();
  var p=document.getElementById('inp-pass').value.trim();
  if(!u||!p){err.textContent='Preencha usuário e senha.';err.style.display='block';return;}
  btn.disabled=true; spin.style.display='block'; err.style.display='none';
  _jsonp({action:'login',usuario:u,senha:p}, function(e,res){
    btn.disabled=false; spin.style.display='none';
    if(e||!res){err.textContent='Erro de conexão: '+(e?e.message:'sem resposta')+'.';err.style.display='block';return;}
    if(!res.ok){err.textContent=res.error||'Usuário ou senha incorretos.';err.style.display='block';return;}
    try{sessionStorage.setItem(SESSION_KEY, JSON.stringify({usuario:res.usuario, podeAtualizar:!!res.podeAtualizar, acessaInvestidores:!!res.acessaInvestidores, acessaDespesas:!!res.acessaDespesas, token:res.token, ts:Date.now()}));}catch(ex){}
    window.location.replace('painel.html');
  });
}

btn.addEventListener('click', doLogin);
document.getElementById('inp-pass').addEventListener('keydown', function(e){if(e.key==='Enter')doLogin();});
document.getElementById('inp-user').addEventListener('keydown', function(e){if(e.key==='Enter')document.getElementById('inp-pass').focus();});
</script>
